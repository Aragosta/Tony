name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  # Builds the apps on demand (Actions tab, "Run workflow").
  workflow_dispatch:
  # The opencode-update workflow runs the full suite on its bump branch.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Plugin, app build and version-pin unit tests
        run: bun test packages/opencode-plugin packages/desktop packages/eval/test/pins.test.ts
      # The eval drives opencode through bash scripts; on Windows that is Git Bash.
      - name: Eval unit tests
        if: runner.os != 'Windows'
        run: bun test packages/eval/test/events.test.ts packages/eval/test/report.test.ts packages/eval/test/tasks.test.ts packages/eval/test/run.test.ts
      # The integration tests drive a real opencode, the same engine version the app bundles.
      - name: Install the pinned opencode
        shell: bash
        run: npm i -g "@opencode/cli@$(cat packages/desktop/opencode-version)"
      - name: Integration (real opencode + scripted model)
        shell: bash
        env:
          TONY_INTEGRATION: "1"
        run: bun test packages/eval/test/integration


  # The Tony app: opencode's desktop app at the pinned version + Tony's patches and brain (packages/desktop).
  # macOS and Windows minutes are expensive, so this runs on main, by hand, and for opencode updates (workflow_call),
  # not on every branch push.
  app:
    if: inputs.ref != '' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - name: Build the Tony app
        run: bun run --cwd packages/desktop build
      - name: Use the app's bundled engine for the checks
        shell: bash
        run: echo "TONY_OPENCODE_BIN=$(node -p 'require("./packages/desktop/.build/app.json").engine')" >> "$GITHUB_ENV"
      - name: Tony's features against the app's engine (real opencode + scripted model)
        shell: bash
        env:
          TONY_INTEGRATION: "1"
        run: bun test packages/eval/test/integration
      - name: Launch the app; its own engine runs with Tony active
        shell: bash
        env:
          TONY_APP: "1"
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a bun test packages/desktop/test/app.test.ts
          else bun test packages/desktop/test/app.test.ts; fi
      - uses: actions/upload-artifact@v4
        with:
          name: tony-${{ runner.os }}-${{ runner.arch }}
          path: packages/desktop/.build/tony-*.tar
          if-no-files-found: error
          # .build is a hidden folder, which upload-artifact skips by default.
          include-hidden-files: true
